name: PR Validation

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '9.3.1'
  JAVA_VERSION: '17'
  ANDROID_API: '36'

jobs:
  validate:
    name: Unit + Robolectric + APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-${{ env.ANDROID_API }}

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Validate Appwrite CI configuration
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_RESIDENT_FILES_BUCKET_ID: ${{ vars.APPWRITE_RESIDENT_FILES_BUCKET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_DATABASE_ID APPWRITE_RESIDENT_FILES_BUCKET_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured as a GitHub Actions repository variable."
              exit 1
            fi
          done
          case "$APPWRITE_ENDPOINT" in
            https://*) ;;
            *) echo "::error::APPWRITE_ENDPOINT must use HTTPS."; exit 1 ;;
          esac
          echo "Appwrite CI configuration is present."

      - name: Generate CI Appwrite environment
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_RESIDENT_FILES_BUCKET_ID: ${{ vars.APPWRITE_RESIDENT_FILES_BUCKET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'APPWRITE_ENDPOINT=%s\n' "$APPWRITE_ENDPOINT"
            printf 'APPWRITE_PROJECT_ID=%s\n' "$APPWRITE_PROJECT_ID"
            printf 'APPWRITE_DATABASE_ID=%s\n' "$APPWRITE_DATABASE_ID"
            printf 'APPWRITE_RESIDENT_FILES_BUCKET_ID=%s\n' "$APPWRITE_RESIDENT_FILES_BUCKET_ID"
          } > .env

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Run unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload PR APK
        uses: actions/upload-artifact@v4
        with:
          name: e-barangay-sua-pr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ramus:
    name: Android runtime smoke test
    needs: validate
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download PR APK
        uses: actions/download-artifact@v4
        with:
          name: e-barangay-sua-pr-debug-apk
          path: ramus-apk

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Ramus smoke test
        env:
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RAMUS_API_KEY:-}" ]]; then
            echo "::error::RAMUS_API_KEY is not configured."
            exit 1
          fi

          APK="$(find ramus-apk -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::No APK found."; exit 1; }

          SESSION_JSON="$(npx --yes ramus-cli@0.1.13 session start --apk "$APK" --wait)"
          echo "$SESSION_JSON"

          SESSION="$(jq -r '.session // empty' <<<"$SESSION_JSON")"
          WATCH_URL="$(jq -r '.watchUrl // empty' <<<"$SESSION_JSON")"
          test -n "$SESSION" || { echo "::error::Ramus did not return a session id."; exit 1; }

          if [[ -n "$WATCH_URL" ]]; then
            {
              echo "### Ramus Android smoke test"
              echo "Watch: $WATCH_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          cleanup() {
            npx --yes ramus-cli@0.1.13 session end --session "$SESSION" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes ramus-cli@0.1.13 wait --session "$SESSION" --stable
          SNAPSHOT="$(npx --yes ramus-cli@0.1.13 snapshot --session "$SESSION")"
          echo "$SNAPSHOT"

          jq -e '.elements[]? | select((.text // "") == "e-Barangay Sua")' <<<"$SNAPSHOT" >/dev/null

          LOGCAT="$(npx --yes ramus-cli@0.1.13 logcat --session "$SESSION" --limit 300)"
          if grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL' <<<"$LOGCAT"; then
            echo "::error::Fatal Android exception detected."
            echo "$LOGCAT"
            exit 1
          fi

          echo "Ramus smoke test passed.";
