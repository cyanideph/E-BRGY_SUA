name: PR Validation

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.13'
  JAVA_VERSION: '21'
  ANDROID_API: '36'

jobs:
  validate:
    name: Unit + Robolectric + APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-${ANDROID_API}"

      - name: Validate Appwrite CI configuration
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_RESIDENT_FILES_BUCKET_ID: ${{ vars.APPWRITE_RESIDENT_FILES_BUCKET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APPWRITE_ENDPOINT="${APPWRITE_ENDPOINT:-https://sgp.cloud.appwrite.io/v1}"
          APPWRITE_PROJECT_ID="${APPWRITE_PROJECT_ID:-6ac31e4000390af0f850}"
          APPWRITE_DATABASE_ID="${APPWRITE_DATABASE_ID:-ebarangay-sua-db}"
          APPWRITE_RESIDENT_FILES_BUCKET_ID="${APPWRITE_RESIDENT_FILES_BUCKET_ID:-resident-files}"
          case "$APPWRITE_ENDPOINT" in
            https://*) ;;
            *) echo "::error::APPWRITE_ENDPOINT must use HTTPS."; exit 1 ;;
          esac
          for name in APPWRITE_PROJECT_ID APPWRITE_DATABASE_ID APPWRITE_RESIDENT_FILES_BUCKET_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is empty."
              exit 1
            fi
          done
          echo "Appwrite CI configuration validated."
      - name: Generate CI Appwrite environment
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_RESIDENT_FILES_BUCKET_ID: ${{ vars.APPWRITE_RESIDENT_FILES_BUCKET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          APPWRITE_ENDPOINT="${APPWRITE_ENDPOINT:-https://sgp.cloud.appwrite.io/v1}"
          APPWRITE_PROJECT_ID="${APPWRITE_PROJECT_ID:-6ac31e4000390af0f850}"
          APPWRITE_DATABASE_ID="${APPWRITE_DATABASE_ID:-ebarangay-sua-db}"
          APPWRITE_RESIDENT_FILES_BUCKET_ID="${APPWRITE_RESIDENT_FILES_BUCKET_ID:-resident-files}"
          {
            printf 'APPWRITE_ENDPOINT=%s\n' "$APPWRITE_ENDPOINT"
            printf 'APPWRITE_PROJECT_ID=%s\n' "$APPWRITE_PROJECT_ID"
            printf 'APPWRITE_DATABASE_ID=%s\n' "$APPWRITE_DATABASE_ID"
            printf 'APPWRITE_RESIDENT_FILES_BUCKET_ID=%s\n' "$APPWRITE_RESIDENT_FILES_BUCKET_ID"
          } > .env

      - name: Test Appwrite backend authority
        working-directory: functions/ebrgyauthority
        run: |
          npm install --omit=dev
          node --test index.test.js

      - name: Install Gradle ${{ env.GRADLE_VERSION }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

      - name: Run unit and Robolectric tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload PR APK
        uses: actions/upload-artifact@v4
        with:
          name: e-barangay-sua-pr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ramus:
    name: Android runtime smoke test
    needs: validate
    if: ${{ github.event_name == 'merge_group' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Download PR APK
        uses: actions/download-artifact@v4
        with:
          name: e-barangay-sua-pr-debug-apk
          path: ramus-apk

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Ramus smoke test
        env:
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RAMUS_API_KEY:-}" ]]; then
            echo "::warning::RAMUS_API_KEY is not configured; hosted Android smoke test skipped."
            echo "Ramus smoke test skipped: configure the RAMUS_API_KEY repository secret to enable it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          APK="$(find ramus-apk -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::No APK found."; exit 1; }

          set +e
          SESSION_JSON="$(npx --yes ramus-cli@0.1.13 session start --apk "$APK" --wait 10 2>&1)"
          SESSION_START_STATUS=$?
          set -e
          if [[ "$SESSION_START_STATUS" -ne 0 ]]; then
            echo "::error::Ramus session start failed (exit $SESSION_START_STATUS); diagnostic output follows."
            printf '%s\n' "$SESSION_JSON"
            exit "$SESSION_START_STATUS"
          fi
          echo "$SESSION_JSON"

          # The CLI emits progress JSON events as well as the final session object.
          # Slurp all JSON values and select only the final session object so SESSION
          # contains one ID, not several concatenated IDs that exceed Ramus's 64-char limit.
          SESSION="$(jq -sr 'map(select(.session? and (.session | type == "string"))) | last | .session // empty' <<<"$SESSION_JSON")"
          WATCH_URL="$(jq -sr 'map(select(.watchUrl? and (.watchUrl | type == "string"))) | last | .watchUrl // empty' <<<"$SESSION_JSON")"
          test -n "$SESSION" || { echo "::error::Ramus did not return a session id."; exit 1; }
          if [[ "${#SESSION}" -gt 64 ]]; then
            echo "::error::Parsed Ramus session ID exceeds 64 characters (${#SESSION}); refusing to continue."
            exit 1
          fi
          echo "Ramus session ID parsed successfully (${#SESSION} characters)."

          if [[ -n "$WATCH_URL" ]]; then
            {
              echo "### Ramus Android smoke test"
              echo "Watch: $WATCH_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          cleanup() {
            npx --yes ramus-cli@0.1.13 session end --session "$SESSION" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Wait for a stable device, then preserve diagnostics even if an assertion fails.
          npx --yes ramus-cli@0.1.13 wait --session "$SESSION" --stable
          SNAPSHOT="$(npx --yes ramus-cli@0.1.13 snapshot --session "$SESSION")"
          printf '%s\n' "$SNAPSHOT" | tee ramus-snapshot.json

          set +e
          LOGCAT="$(npx --yes ramus-cli@0.1.13 logcat --session "$SESSION" --limit 1000 2>&1)"
          LOGCAT_STATUS=$?
          set -e
          printf '%s\n' "$LOGCAT" | tee ramus-logcat.txt
          if [[ "$LOGCAT_STATUS" -ne 0 ]]; then
            echo "::warning::Ramus logcat collection exited with status $LOGCAT_STATUS."
          fi

          # Search text fields recursively because snapshot schemas may nest UI elements
          # differently between devices/CLI versions. Match title casing and spacing flexibly.
          if jq -e '[.. | objects | .text? | strings | select(test("e-?Barangay\\s+Sua"; "i"))] | length > 0' <<<"$SNAPSHOT" >/dev/null; then
            echo "Found expected app title in the Ramus snapshot."
          else
            echo "::error::Expected UI title matching \"e-?Barangay\\s+Sua\" was not found."
            echo "Snapshot structure and rendered text are saved in ramus-snapshot.json."
            echo "Recent device logcat is saved in ramus-logcat.txt."
            {
              echo "### Ramus Android smoke test: UI assertion failed"
              echo "- Expected a visible text field matching `e-?Barangay Sua` (case-insensitive)."
              if [[ -n "$WATCH_URL" ]]; then echo "- Watch: $WATCH_URL"; fi
              echo "- Diagnostic artifacts: `ramus-snapshot.json`, `ramus-logcat.txt`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL' <<<"$LOGCAT"; then
            echo "::error::Fatal Android exception detected."
            exit 1
          fi

          echo "Ramus smoke test passed.";

      - name: Upload Ramus diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ramus-diagnostics
          path: |
            ramus-snapshot.json
            ramus-logcat.txt
          if-no-files-found: ignore
          retention-days: 7
