name: PR Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - feature/sua-civic-platform

permissions:
  contents: read

jobs:
  unit-and-robolectric:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare local Appwrite build configuration
        run: cp .env.example .env

      - name: Generate Gradle wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Run Robolectric/JVM tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compile debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
