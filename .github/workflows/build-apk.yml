name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle and generate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.3.1 --distribution-type bin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Validate Appwrite CI configuration
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_RESIDENT_FILES_BUCKET_ID: ${{ vars.APPWRITE_RESIDENT_FILES_BUCKET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_DATABASE_ID APPWRITE_RESIDENT_FILES_BUCKET_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured as a GitHub Actions repository variable."
              exit 1
            fi
          done
          echo "Appwrite CI configuration is present."

      - name: Generate CI Appwrite environment
        env:
          APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT }}
          APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID }}
          APPWRITE_DATABASE_ID: ${{ vars.APPWRITE_DATABASE_ID }}
          APPWRITE_RESIDENT_FILES_BUCKET_ID: ${{ vars.APPWRITE_RESIDENT_FILES_BUCKET_ID }}
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'APPWRITE_ENDPOINT=%s\n' "$APPWRITE_ENDPOINT"
            printf 'APPWRITE_PROJECT_ID=%s\n' "$APPWRITE_PROJECT_ID"
            printf 'APPWRITE_DATABASE_ID=%s\n' "$APPWRITE_DATABASE_ID"
            printf 'APPWRITE_RESIDENT_FILES_BUCKET_ID=%s\n' "$APPWRITE_RESIDENT_FILES_BUCKET_ID"
          } > .env

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v             -keystore debug.keystore             -storepass android             -alias androiddebugkey             -keypass android             -keyalg RSA             -keysize 2048             -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: e-barangay-sua-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  ramus-smoke-test:
    name: Ramus Android smoke test
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: e-barangay-sua-debug-apk
          path: ramus-apk

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # No npm lockfile is required; Ramus CLI is invoked with npx.

      - name: Run Ramus smoke test
        env:
          RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RAMUS_API_KEY:-}" ]]; then
            echo "::error::RAMUS_API_KEY is not configured. Create a Ramus API key and add it as a GitHub Actions secret named RAMUS_API_KEY."
            exit 1
          fi

          APK="$(find ramus-apk -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo "::error::No APK was found in the downloaded artifact."
            exit 1
          fi

          SESSION_JSON="$(npx --yes ramus-cli@0.1.13 session start --apk "$APK" --wait)"
          echo "$SESSION_JSON"

          SESSION="$(jq -r '.session // empty' <<<"$SESSION_JSON")"
          WATCH_URL="$(jq -r '.watchUrl // empty' <<<"$SESSION_JSON")"
          if [[ -z "$SESSION" ]]; then
            echo "::error::Ramus did not return a session id."
            exit 1
          fi

          echo "Ramus session: $SESSION"
          if [[ -n "$WATCH_URL" ]]; then
            echo "Ramus watch URL: $WATCH_URL"
            echo "### Ramus smoke test" >> "$GITHUB_STEP_SUMMARY"
            echo "Watch: $WATCH_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

          cleanup() {
            npx --yes ramus-cli@0.1.13 session end --session "$SESSION" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          npx --yes ramus-cli@0.1.13 wait --session "$SESSION" --stable
          SNAPSHOT="$(npx --yes ramus-cli@0.1.13 snapshot --session "$SESSION")"
          echo "$SNAPSHOT"

          if ! jq -e '.elements[]? | select((.text // "") == "e-Barangay Sua")' <<<"$SNAPSHOT" >/dev/null; then
            echo "::error::Ramus smoke test could not find the e-Barangay Sua app identity on the first stable screen."
            exit 1
          fi

          LOGCAT="$(npx --yes ramus-cli@0.1.13 logcat --session "$SESSION" --limit 200)"
          if grep -Eiq 'FATAL EXCEPTION|AndroidRuntime.*FATAL' <<<"$LOGCAT"; then
            echo "::error::Fatal Android exception detected in Ramus logcat."
            echo "$LOGCAT"
            exit 1
          fi

          echo "Ramus smoke test passed: APK installed, app reached a stable screen, identity was detected, and no fatal exception was found."
